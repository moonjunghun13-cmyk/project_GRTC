spring:
  application:
    name: main
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
  datasource:
    url: jdbc:postgresql://localhost:5432/project
    username: postgres
    password: 1004
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

# 우리 프로젝트 전용 설정 (spring: 아래가 아니라 최상위에 있어야 @Value("${app...}") 로 읽힌다)
app:
  file:
    upload-dir: C:/mmg/uploads
  cors:
    allowed-origins: http://localhost:5173
  seed:
    enabled: true   # 관리자 계정(admin) 자동 생성. 운영 환경에서는 false
  # 로그인 토큰(JWT) 설정 - 명세서 3-1: Access 30분, Refresh 14일(HttpOnly 쿠키)
  jwt:
    # 서명 키(32자 이상). dashboard 서버의 app.jwt.secret 과 반드시 같은 값이어야 한다.
    # 아래 값은 개발용이다. 운영 환경에서는 다른 값으로 바꾸고 외부에 공개하지 않는다.
    secret: 1zYDlfjMbLuLIKe5todcGclf_mQod8dcuWH2AMK7lGAerKnL5EbX3Y0mZUj5H0IK
    access-expiration-minutes: 30
    refresh-expiration-days: 14
    refresh-cookie-secure: false   # 운영(HTTPS)에서는 true

server:
  port: 8081

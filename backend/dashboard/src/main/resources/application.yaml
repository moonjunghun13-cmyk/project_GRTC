spring:
  application:
    name: dashboard
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
  datasource:
    url: jdbc:postgresql://localhost:5432/project
    username: postgres
    password: 1004
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

app:
  file:
    upload-dir: C:/mmg/uploads   # main 서버와 같은 폴더 (민원 첨부파일을 같이 사용)
  cors:
    allowed-origins: http://localhost:5173
  seed:
    enabled: true   # 노선/역/차량/운행/배차 예시 데이터 자동 생성. 운영 환경에서는 false
  # 로그인 토큰(JWT) 설정 - 로그인은 main 서버가 담당하고, 이 서버는 main 이 발급한 Access 토큰을 검증만 한다.
  jwt:
    # 서명 키. main 서버의 app.jwt.secret 과 반드시 같은 값이어야 한다. (다르면 모든 요청이 401)
    secret: 1zYDlfjMbLuLIKe5todcGclf_mQod8dcuWH2AMK7lGAerKnL5EbX3Y0mZUj5H0IK

# main 서버(8081)와 동시에 띄우기 위해 다른 포트 사용
server:
  port: 8082

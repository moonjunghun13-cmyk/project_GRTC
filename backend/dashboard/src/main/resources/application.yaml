spring:
  application:
    name: dashboard
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
  datasource:
    url: jdbc:postgresql://localhost:5432/project
    username: postgres
    password: 1004
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  # main 서버에서 로그인한 세션을 DB 에서 같이 읽는다 (같은 DB, 같은 SESSION 쿠키)
  session:
    jdbc:
      initialize-schema: always

app:
  file:
    upload-dir: C:/mmg/uploads   # main 서버와 같은 폴더 (민원 첨부파일을 같이 사용)
  cors:
    allowed-origins: http://localhost:5173
  seed:
    enabled: true   # 노선/역/차량/운행/배차 예시 데이터 자동 생성. 운영 환경에서는 false

# main 서버(8081)와 동시에 띄우기 위해 다른 포트 사용
server:
  port: 8082
  servlet:
    session:
      timeout: 30m
